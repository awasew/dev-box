[dev-environment]
name = "my-project-dev"
image = "ubuntu:24.04"
additional_packages = "git curl build-essential"
init_hooks = "echo 'dbx environment ready'"

# Host env vars to forward into every `dbx enter` / `ssh` session.
# Only *names* go here -- dbx reads the live values from whatever
# shell you ran `dbx up` / `dbx enter` / `ssh` from, and never
# writes the values themselves to disk. Safe to commit.
forward_env = "OPENAI_API_KEY ANTHROPIC_API_KEY GITHUB_TOKEN"
