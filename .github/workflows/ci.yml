name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  integration:
    name: Integration tests (real Distrobox + Podman)
    runs-on: ubuntu-latest
    # Real container startup/image pulls can be flaky in CI; surface
    # failures without blocking merges on transient infra issues. The
    # `test` job above already covers every hermetic code path on all
    # three platforms and is what actually gates merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Distrobox + Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          curl -s https://raw.githubusercontent.com/89luca89/distrobox/main/install | sudo sh
      - name: Run opt-in integration tests (tests/distrobox_integration.rs)
        run: cargo test --test distrobox_integration -- --ignored --test-threads=1
