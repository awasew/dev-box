name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? What did you expect to happen?
      placeholder: Clear description of the issue
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this bug?
      placeholder: |
        1. Create a devbox.ini with...
        2. Run `dev-box up`
        3. ...
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: dev-box should...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: Instead, it...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows (WSL2)
        - Other
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: "Output of `rustc --version`"
      placeholder: "rustc 1.75.0"
    validations:
      required: true

  - type: input
    id: distrobox-version
    attributes:
      label: Distrobox Version
      description: "Output of `distrobox --version`"
      placeholder: "distrobox 1.5.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (if applicable)
      description: |
        Run the failing command with debug logging:
        `RUST_LOG=debug dev-box <command> 2>&1`
      placeholder: Paste output here
      render: bash

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might help?
      placeholder: Screenshots, stack traces, workarounds, etc.
