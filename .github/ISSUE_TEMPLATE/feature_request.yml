name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feature suggestion! Help us understand your use case and vision.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Why is it needed?
      placeholder: |
        Currently, dev-box doesn't support X, which makes it difficult to...
        This affects developers who...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        I would like dev-box to support:
        - New CLI flag: `dev-box up --feature-flag`
        - Config option: `feature = true` in devbox.ini
        - ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other ways could this problem be solved?
      placeholder: |
        1. Use existing tool X (but it requires...)
        2. Manual workaround (but this is tedious because...)
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case / Example
      description: Concrete example of how you'd use this feature
      placeholder: |
        Scenario: I'm working on a Rust + Python project where...
        With this feature, I could:
        1. ...
        2. ...
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What part of dev-box does this affect?
      options:
        - CLI / Commands
        - Configuration
        - SSH / Keyless Auth
        - Filesystem Performance
        - Container Lifecycle
        - IDE Integration
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Breaking Changes
      description: Would this require changes to existing behavior?
      options:
        - label: This is a breaking change
        - label: This is backward compatible

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Links to related issues, discussion threads, or external references
      placeholder: Refs #123, https://github.com/...
