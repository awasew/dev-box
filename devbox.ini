[dev-environment]
name = "my-project-dev"
image = "ubuntu:24.04"
additional_packages = "git curl build-essential"
init_hooks = "echo 'dev-box environment ready'"

# Host env vars to forward into every `dev-box enter` / `ssh` session.
# Only *names* go here -- dev-box reads the live values from whatever
# shell you ran `dev-box up` / `dev-box enter` / `ssh` from, and never
# writes the values themselves to disk. Safe to commit.
forward_env = "OPENAI_API_KEY ANTHROPIC_API_KEY GITHUB_TOKEN"
