# GitHub Pages configuration for dbx

# Site settings
title: dbx
tagline: "IDE-independent developer environments with keyless SSH, native filesystem performance, and zero vendor lock-in."
description: "A lightweight, single-binary Rust orchestrator for reproducible developer environments on any platform — without vendor lock-in, without SSH key setup, and with 5-10x faster builds on macOS/Windows."
url: "https://srikanthrayudu.github.io"
baseurl: "/dbx"

# Repository
repository: srikanthrayudu/dbx
github_url: "https://github.com/srikanthrayudu/dbx"

# Author
author:
  name: Srikanth Rayudu
  url: "https://github.com/srikanthrayudu"
  github: srikanthrayudu
  twitter: srikanthrayudu
  linkedin: srikanthrayudu

# Social & Open Graph (for jekyll-seo-tag)
logo: "/docs/images/hero.png"
twitter:
  username: srikanthrayudu
  card: summary_large_image
social:
  name: dbx
  links:
    - "https://github.com/srikanthrayudu/dbx"
    - "https://github.com/srikanthrayudu/dbx/discussions"
    - "https://linkedin.com/in/srikanthrayudu"
    - "https://twitter.com/srikanthrayudu"

# Theme
theme: jekyll-theme-minimal

# Build & Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Plugins supported by GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Documentation Collections / Permalinks
permalink: /:categories/:title:output_ext

# Exclude internal and build-related files from Jekyll processing
exclude:
  - Gemfile
  - Gemfile.lock
  - Cargo.toml
  - Cargo.lock
  - target/
  - src/
  - devbox.ini
  - devbox.local.ini
  - .github/
  - .gitignore
  - LICENSE
  - CONTRIBUTING.md
  - CHANGELOG.md
  - GROWTH_STRATEGY.md
  - LINKEDIN_STRATEGY.md

